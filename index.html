<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Analects Reader</title>
<meta name="description" content="A meaning-first reader for the Analects.">
<meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Analects">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <p class="loading">Loading the texts…</p>
</div>

<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-head" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<button type="button" id="update-bar" class="update-bar" hidden>Update ready — tap to reload</button>

<script src="app.js"></script>
</body>
</html>
